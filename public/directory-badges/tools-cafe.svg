    <rect width="40" height="40" rx="11" fill="#2C1A0C"/>
    <g transform="translate(2.5 3.4) scale(0.55)">
      <g stroke="#C17A3A" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.95">
        <path d="M25 16 q -3.5 -4.5 0 -9"/><path d="M33 16 q 3.5 -4.5 0 -9"/>
      </g>
      <path d="M47 30 c 9 0 9 13 0 13" fill="none" stroke="#FDFBF7" stroke-width="4"/>
      <rect x="13" y="22" width="34" height="29" rx="6.5" fill="#FDFBF7"/>
      <path d="M21 33 l 5.5 4 l -5.5 4" fill="none" stroke="#C17A3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="39.5" width="10" height="2.8" rx="1.4" fill="#2C1A0C"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 80" width="256" height="80" role="img" aria-label="Featured on tools.cafe">
  <rect width="256" height="80" rx="12" fill="#FBF8F4"/>

  <!-- Original logo icon, centered vertically in 80px badge -->

<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hGradientL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="hGradient2L" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadowL" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 外框：紫色边框层 -->
  <rect x="0" y="0" width="180" height="48" rx="8" fill="#A855F7" filter="url(#shadowL)"/>

  <!-- 内框：白色背景层 (1px边框) -->
  <rect x="1" y="1" width="178" height="46" rx="7" fill="#FFFFFF"/>

  <!-- H 图标 -->
  <g transform="translate(10, 6)">
    <!-- 外圈 -->
    <circle cx="18" cy="18" r="16" fill="url(#hGradientL)" opacity="0.1"/>
    <!-- 内圈背景 -->
    <circle cx="18" cy="18" r="14" fill="#F8FAFC"/>
    <!-- H 字母 -->
    <g transform="translate(18, 18)">
      <!-- 左竖 -->
      <rect x="-7" y="-9" width="4" height="18" rx="2" fill="url(#hGradientL)"/>
      <!-- 右竖 -->
      <rect x="3" y="-9" width="4" height="18" rx="2" fill="url(#hGradientL)"/>
      <!-- 中横 -->
      <rect x="-7" y="-3" width="14" height="4" rx="1" fill="url(#hGradient2L)"/>
    </g>
    <!-- 边框 -->
    <circle cx="18" cy="18" r="14" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- 文字 -->
  <text x="52" y="20" fill="#64748B" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    Featured on
  </text>

  <text x="52" y="37" fill="#1E293B" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    HiProducty →
  </text>

  <!-- 右侧星星 -->
  <g transform="translate(154, 14)">
    <path d="M10 0L12.25 7.5L20 7.5L13.75 12.5L16 20L10 15L4 20L6.25 12.5L0 7.5L7.75 7.5L10 0Z" fill="#F59E0B"/>
  </g>
</svg>

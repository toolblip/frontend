[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckCommand = "node -e \"const h=http=require('http');h.get('http://localhost:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
healthcheckTimeout = 300
sleepApplication = false

[_variables]
NODE_ENV = "production"

name: E2E Auth Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - "docs/**/*.md"
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - "docs/**/*.md"
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth E2E regression tests
        run: npm run test:e2e

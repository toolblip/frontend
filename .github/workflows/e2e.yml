name: E2E Auth Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'

jobs:
  # Specs share one stateful mock server, so each shard gets its own runner,
  # mock server and dev server instead of more workers on one machine.
  auth-e2e-shard:
    name: auth-e2e (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth E2E regression tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/6

  # Single check name for branch protection / merge gating.
  auth-e2e:
    if: always()
    needs: auth-e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.auth-e2e-shard.result }}" = success

name: E2E Auth Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/qa/**'
      - '.github/workflows/tool-qa*.yml'

jobs:
  # Specs share one stateful mock server, so each shard gets its own runner,
  # mock server and dev server instead of more workers on one machine.
  auth-e2e-shard:
    name: auth-e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps live outside the cache, so install them on a hit.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run auth E2E regression tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

  # Single check name for branch protection / merge gating.
  auth-e2e:
    if: always()
    needs: auth-e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.auth-e2e-shard.result }}" = success

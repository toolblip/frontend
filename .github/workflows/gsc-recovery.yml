name: GSC recovery tracking

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-recovery
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch tracker files at workflow commit
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { mkdir, writeFile } = require('node:fs/promises');
            const { dirname } = require('node:path');
            // Fetch directly to avoid checkout cleanup of the legacy malformed api gitlink.
            for (const path of ['scripts/gsc-recovery.mjs', 'scripts/gsc-site-performance.mjs', 'scripts/gsc-sitemap-inspection.mjs', 'data/gsc-recovery-cohort.json']) {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: context.sha,
              });
              if (data.type !== 'file' || data.encoding !== 'base64' ||
                  typeof data.content !== 'string' || !data.content.trim()) {
                throw new Error(`Invalid file response for ${path}`);
              }
              const content = data.content.replace(/\s/g, '');
              const decoded = Buffer.from(content, 'base64');
              if (decoded.toString('base64') !== content) {
                throw new Error(`Invalid base64 content for ${path}`);
              }
              await mkdir(dirname(path), { recursive: true });
              await writeFile(path, decoded);
            }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect fixed-cohort report
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-recovery.mjs
      - name: Collect sitewide performance report
        if: always()
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITEWIDE_URL: ${{ vars.GSC_SITEWIDE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-site-performance.mjs
      - name: Collect live-sitemap URL Inspection report
        if: always()
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITEWIDE_URL: ${{ vars.GSC_SITEWIDE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-sitemap-inspection.mjs --sitemap tools
      - name: Collect blog-sitemap URL Inspection report
        if: always()
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITEWIDE_URL: ${{ vars.GSC_SITEWIDE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-sitemap-inspection.mjs --sitemap blog
      - name: Collect core-sitemap URL Inspection report
        if: always()
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITEWIDE_URL: ${{ vars.GSC_SITEWIDE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-sitemap-inspection.mjs --sitemap core
      - name: Add report to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/gsc-recovery/report.md ]]; then
            cat test-results/gsc-recovery/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC recovery report unavailable; check the failed setup or collection step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f test-results/gsc-site-performance/report.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/gsc-site-performance/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC sitewide performance report unavailable; check the failed setup or collection step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f test-results/gsc-sitemap-inspection/report.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/gsc-sitemap-inspection/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC sitemap URL Inspection report unavailable; check the failed setup or collection step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f test-results/gsc-sitemap-inspection-blog/report.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/gsc-sitemap-inspection-blog/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC blog sitemap URL Inspection report unavailable; check the failed setup or collection step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f test-results/gsc-sitemap-inspection-core/report.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/gsc-sitemap-inspection-core/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC core sitemap URL Inspection report unavailable; check the failed setup or collection step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reports, including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/gsc-recovery/report.json
            test-results/gsc-recovery/report.md
            test-results/gsc-site-performance/report.json
            test-results/gsc-site-performance/report.md
            test-results/gsc-sitemap-inspection/report.json
            test-results/gsc-sitemap-inspection/report.md
            test-results/gsc-sitemap-inspection-blog/report.json
            test-results/gsc-sitemap-inspection-blog/report.md
            test-results/gsc-sitemap-inspection-core/report.json
            test-results/gsc-sitemap-inspection-core/report.md
          retention-days: 90
          if-no-files-found: error

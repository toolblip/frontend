name: GSC recovery tracking

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      inspection_group:
        description: Collection group (performance runs Search Analytics only; no URL Inspections)
        type: choice
        required: true
        default: all
        options:
          - all
          - blog-core
          - tools
          - fixed
          - performance

permissions:
  contents: read

concurrency:
  group: gsc-recovery
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch tracker files at workflow commit
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { mkdir, writeFile } = require('node:fs/promises');
            const { dirname } = require('node:path');
            // Fetch directly to avoid checkout cleanup of the legacy malformed api gitlink.
            for (const path of ['scripts/gsc-recovery.mjs', 'scripts/gsc-site-performance.mjs', 'scripts/gsc-sitemap-inspection.mjs', 'scripts/gsc-workflow.mjs', 'data/gsc-recovery-cohort.json']) {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: context.sha,
              });
              if (data.type !== 'file' || data.encoding !== 'base64' ||
                  typeof data.content !== 'string' || !data.content.trim()) {
                throw new Error(`Invalid file response for ${path}`);
              }
              const content = data.content.replace(/\s/g, '');
              const decoded = Buffer.from(content, 'base64');
              if (decoded.toString('base64') !== content) {
                throw new Error(`Invalid base64 content for ${path}`);
              }
              await mkdir(dirname(path), { recursive: true });
              await writeFile(path, decoded);
            }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect selected reports with run-level quota stop
        env:
          INSPECTION_GROUP: ${{ inputs.inspection_group || 'all' }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:toolblip.com' }}
          GSC_SITEWIDE_URL: ${{ vars.GSC_SITEWIDE_URL || 'sc-domain:toolblip.com' }}
        run: node scripts/gsc-workflow.mjs
      - name: Add report to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/gsc-workflow/report.md ]]; then
            cat test-results/gsc-workflow/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GSC orchestration report unavailable; check setup or collection logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for dir in gsc-recovery gsc-site-performance gsc-sitemap-inspection-core gsc-sitemap-inspection-blog gsc-sitemap-inspection; do
            if [[ -f "test-results/$dir/report.md" ]]; then
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
              cat "test-results/$dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Preserve reports, including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/gsc-workflow/report.json
            test-results/gsc-workflow/report.md
            test-results/gsc-recovery/report.json
            test-results/gsc-recovery/report.md
            test-results/gsc-site-performance/report.json
            test-results/gsc-site-performance/report.md
            test-results/gsc-sitemap-inspection/report.json
            test-results/gsc-sitemap-inspection/report.md
            test-results/gsc-sitemap-inspection-blog/report.json
            test-results/gsc-sitemap-inspection-blog/report.md
            test-results/gsc-sitemap-inspection-core/report.json
            test-results/gsc-sitemap-inspection-core/report.md
          retention-days: 90
          if-no-files-found: error

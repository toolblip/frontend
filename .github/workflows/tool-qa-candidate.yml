name: Hosted candidate tool QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tool-qa-candidate.yml'
      - 'scripts/qa/hosted-candidate.mjs'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: candidate-tool-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QA_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact candidate without submodule traversal or credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-tool-qa"
          git init .
          git remote add origin https://github.com/toolblip/frontend.git
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git fetch --no-tags origin "$QA_REVIEWED_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$QA_REVIEWED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          if git config --local --name-only --get-regexp 'extraheader|credential|sshcommand'; then
            echo 'Unexpected persisted authentication configuration' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        id: dependencies
      - name: Unit tests
        id: unit
        run: npm test -- --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/candidate-tool-qa/unit.log"
      - name: Default production build (Turbopack)
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/candidate-tool-qa/build.log"
      - name: TypeScript after production type generation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx --no-install tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/candidate-tool-qa/typescript.log"
      - name: Install official engines and output inspection tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright install --with-deps chrome webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
      - name: Audit affected candidate tools in both engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/hosted-candidate.mjs "$RUNNER_TEMP/candidate-tool-qa/audit"
      - name: Upload candidate evidence (never production approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-tool-qa/
          if-no-files-found: warn
          retention-days: 14
